<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1197 1197" width="1197" height="1197" role="img" aria-label="money track">
  <!--
    Brand mark, hryvnia variant. Regenerated from `docs/logo-src/hryvna-logo.svg` (the author's artwork) with one
    change: the rounded corner. Keep them in step by regenerating rather than by editing here.

    The glyph is a PATH, not a `text` element, which is why this file renders identically in a
    browser tab, in `sips` (which generates the PNG icons from it) and in an Android launcher: no
    font to be missing, no baseline attribute to be interpreted differently.

    The maskable icon uses the same artwork WITHOUT the radius (`docs/icon-maskable.svg`): a
    launcher applies its own shape, and a rounded rect inside a circular mask shows as a clipped
    corner.
    NOTE: no double hyphen may appear inside this comment. It is not valid XML, and a strict SVG
    renderer refuses the whole document over it while browsers quietly forgive it.
  -->
